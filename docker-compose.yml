version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: celaloglu-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - celaloglu-network
    depends_on:
      - db
      - redis

  nginx:
    image: nginx:alpine
    container_name: celaloglu-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./:/var/www
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./docker/nginx/sites/:/etc/nginx/sites-available
      - ./docker/nginx/ssl/:/etc/ssl/certs
    networks:
      - celaloglu-network
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: celaloglu-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: celaloglu_insaat
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_USER: celaloglu_user
      MYSQL_PASSWORD: celaloglu_password
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - celaloglu-network

  redis:
    image: redis:alpine
    container_name: celaloglu-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - celaloglu-network

volumes:
  db_data:

networks:
  celaloglu-network:
    driver: bridge